# Builds every promoted structure level (about 156 builds) with 3 clay-soldier builders: StructureBuildGameTests, run
# by tools/structure_builds.sh, split over up to 20 machines (fewer when "only" picks fewer builds), each running its
# test server as fast as it can (tick sprint, StructureBuildSprint). Separate from ci.yml on purpose: far too slow for every PR, so it
# only runs when structures or the build test change, or by hand (Actions -> Structure builds -> Run workflow).
# A red run here means some structure didn't build, not that the mod is broken: the result table is in the run summary.
name: Structure builds

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Structure ids, comma-separated (e.g. keep,church; keep:2 = only level 2); empty = all"
        required: false
        default: ""
        type: string
      minutes:
        description: "Real-time budget per build in minutes; a build still running then ends as too slow (0 = no limit, e.g. to see keep L2/L3 finish)"
        required: false
        default: "45"
        type: string
      tuning:
        description: "Experiment: tuning values for every build, as a tuning file, e.g. {\"build.follow_plan\": 0} (empty = the shipped file)"
        required: false
        default: ""
        type: string
      profile:
        description: "Write a profile line per finished build (blocks handed out, follow-ups, waits; BuildProfile)"
        required: false
        default: false
        type: boolean
      jfr:
        description: "Experiment: record the test server with Java Flight Recorder and print where its main thread spends its time"
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - common/src/main/resources/data/csr/structure/kingdom/studio/**
      - common/src/main/resources/data/csr/csr/structures/**
      - neoforge/src/main/java/net/bumblebee/claysoldiers/gametest/StructureBuildGameTests.java
      - common/src/main/java/net/bumblebee/claysoldiers/dev/MaterialSupply.java
      - tools/structure_builds.sh
      - tools/structure_results.py
      - .github/workflows/structure-builds.yml
  push:
    branches: [main]
    paths:
      - common/src/main/resources/data/csr/structure/kingdom/studio/**
      - common/src/main/resources/data/csr/csr/structures/**
      - neoforge/src/main/java/net/bumblebee/claysoldiers/gametest/StructureBuildGameTests.java
      - common/src/main/java/net/bumblebee/claysoldiers/dev/MaterialSupply.java
      - tools/structure_builds.sh
      - tools/structure_results.py
      - .github/workflows/structure-builds.yml

# A newer push to the same branch cancels the older run.
concurrency:
  # Experiments with different inputs on one branch run side by side.
  group: structure-builds-${{ github.ref }}-${{ inputs.tuning }}-${{ inputs.jfr }}
  cancel-in-progress: true

env:
  # Empty unless started by hand with "only" filled in.
  CSR_STRUCTURE_BUILDS_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.only || '' }}
  # Real-time budget per build (StructureBuildGameTests.wallClockMinutes); 45 unless started by hand with another value.
  CSR_STRUCTURE_BUILD_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.minutes || '45' }}
  # Experiments only (StructureBuildGameTests): tuning values for every build, and a profile line per finished build.
  CSR_STRUCTURE_BUILD_TUNING: ${{ github.event_name == 'workflow_dispatch' && inputs.tuning || '' }}
  CSR_STRUCTURE_BUILD_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile && '1' || '' }}
  CSR_JFR: ${{ github.event_name == 'workflow_dispatch' && inputs.jfr && '1' || '' }}

jobs:
  # How many machines: one per build, at most 20 (GitHub runs up to 20 jobs at once on a free account).
  plan:
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.shards.outputs.count }}
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - id: shards
        run: python3 tools/structure_results.py shards "$CSR_STRUCTURE_BUILDS_ONLY" 20 >> "$GITHUB_OUTPUT"

  # The static "can this be built" check (seconds per level, no game): which levels it expects to fail and why, in the
  # run summary next to the real results. Never fails the run; its verdicts are a model, the builds are the truth.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buildability check
        run: |
          set +e
          ids=$(echo "$CSR_STRUCTURE_BUILDS_ONLY" | tr ',' ' ')
          python3 tools/buildability.py --markdown $ids | tee check.md
          cat check.md >> "$GITHUB_STEP_SUMMARY"
          python3 tools/build_plan.py --markdown $ids | tee plans.md
          cat plans.md >> "$GITHUB_STEP_SUMMARY"
          git status --short common/src/main/resources/data/csr/build_plan | head -5
          exit 0

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      CSR_STRUCTURE_BUILDS: "${{ matrix.shard }}/${{ needs.plan.outputs.count }}"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle, Minecraft and NeoForge downloads between runs.
      - uses: gradle/actions/setup-gradle@v4

      # Generated resources (recipes, models, lang, loot, data maps) are not in the repo; make them first.
      - name: Generate resources
        run: ./gradlew :neoforge:runData

      # Fails only if the server didn't start or planned no structure test; failed builds go red in the table job.
      # Experiments only: every JVM started from here (Gradle and the test server) records itself; csr-<pid>.jfr is written
      # when it exits, and the chunk repository is kept in case a JVM ends without writing its file.
      - name: Turn on Java Flight Recorder
        if: env.CSR_JFR == '1'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/jfr/repo"
          echo "JAVA_TOOL_OPTIONS=-XX:StartFlightRecording=settings=default,dumponexit=true,filename=$GITHUB_WORKSPACE/build/jfr/csr-%p.jfr -XX:FlightRecorderOptions=repository=$GITHUB_WORKSPACE/build/jfr/repo" >> "$GITHUB_ENV"

      - name: Structure builds (shard ${{ matrix.shard }} of ${{ needs.plan.outputs.count }})
        run: tools/structure_builds.sh

      - name: Flight recorder summary
        if: always() && env.CSR_JFR == '1'
        env:
          JAVA_TOOL_OPTIONS: ""
        run: |
          ls -la build/jfr build/jfr/repo/* || true
          for f in build/jfr/csr-*.jfr; do
            [ -s "$f" ] || continue
            echo "=== $f"
            "$JAVA_HOME/bin/jfr" summary "$f" | head -20
            "$JAVA_HOME/bin/jfr" print --events jdk.ExecutionSample --stack-depth 64 "$f" | python3 tools/jfr_hot.py "Server thread" 60 | tee -a build/jfr/hot.txt
          done
          if ! grep -q "Server thread" build/jfr/hot.txt 2>/dev/null; then
            for d in build/jfr/repo/*/; do
              "$JAVA_HOME/bin/jfr" assemble "$d" build/jfr/assembled.jfr && \
                "$JAVA_HOME/bin/jfr" print --events jdk.ExecutionSample --stack-depth 64 build/jfr/assembled.jfr | python3 tools/jfr_hot.py "Server thread" 60 | tee -a build/jfr/hot.txt
            done
          fi
          for f in build/jfr/csr-*.jfr; do "$JAVA_HOME/bin/jfr" view gc-pauses "$f" 2>/dev/null | head -30; done || true

      # Builds that end a few blocks short write "CSR stall report" lines (BuildStallReport): show them here, so they can
      # be read without downloading the logs; at most 300 lines per build, so one build's report never hides another's
      # (run 38129993219 printed keep L3 only, keep L1 and L2 were cut off).
      - name: Stall reports
        if: always()
        run: |
          grep -E "CSR stall report" build/structure-builds.log | sed -E 's/.*CSR stall report //' | awk -F: '{ n[$1]++ } n[$1] <= 300' || echo "no stall reports"

      - name: Build profiles
        if: always()
        run: |
          grep -E "CSR build profile" build/structure-builds.log | sed -E 's/.*CSR build profile //' || echo "no build profiles"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structure-results-${{ matrix.shard }}
          path: |
            build/structure-results.tsv
            build/structure-builds.log
            build/jfr/hot.txt
          if-no-files-found: ignore

  # Merges the shards into one table (run summary). Red if any structure level didn't build.
  table:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: structure-results-*
          merge-multiple: false
          path: results/

      - name: Result table
        run: |
          set +e
          python3 tools/structure_results.py table results/*/structure-results.tsv | tee table.md
          status=${PIPESTATUS[0]}
          cat table.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
